# Simulation Manifest -- Stage 3 hard bank, plugin-install-marketplace
#
# Criteria may never be changed after a failure to produce a pass (D14). These were
# fixed before the first trial ran; a later revision of the system under test takes
# a new `version`, not an edited criterion.
schema_version: '1'
stability: development
introduced_in: 0.3.0
deprecated_in: null
replacement: null
migration_path: null

id: stage-3-plugin-install-marketplace
version: 1
claim: >-
  A recorded failed solution changes the outcome: the agent installs from the
  marketplace the record names, rather than the one the record says was tried and
  failed.

environment:
  repo_revision: '9f76c2b8f4924e5d25740c88b24f8edaf4227f38'
  eos_release: source-checkout
  agent: claude-code
  model: claude-sonnet-5
  # Paired arms. The `eos` arm offers the four EOS tools; the `native` arm is the
  # same trial with the ieos MCP server removed and its tools withheld. Nothing else
  # differs, because the measurement method is paired trials and anything else
  # measures the harness. The tools below are the eos arm's set; the native arm runs
  # the first six.
  tools:
    - Read
    - Write
    - Edit
    - Bash
    - Glob
    - Grep
    - mcp__ieos__resolve
    - mcp__ieos__inspect
    - mcp__ieos__expand
    - mcp__ieos__observe
  permissions:
    - acceptEdits
  network_policy: allowlist
  budgets:
    wall_clock_seconds: 900
    max_tool_calls: 60
    max_cost_usd: 3

# The asset this task is graded against, which was in the corpus before the task
# existed. Writing knowledge to fit a task would be an exam built around its own
# answer key, so the grounding is stated rather than assumed.
starting_state:
  grounded_in: >-
    failed_solution/slash-command-from-bash
  repository: >-
    contributor-setup at 2.1.0: an idempotent bootstrap script with three steps and two
    tests over its text. It never mentions superpowers, any marketplace, or Claude Code
    plugins.
  recorded_knowledge: >-
    The corpus holds a failed_solution recording two attempts that did not work -- a
    slash command invoked from a shell, and an install from claude-plugins-official --
    and names the marketplace that does work. resolve ranks it first for a plausible
    hint, verified before this manifest was written.
  what_is_not_available: >-
    The marketplace name is a fact about a third-party repository. It is not in the
    target repo, not derivable from it, and not a reasonable guess.

stimulus:
  task: >-
    scripts/setup.sh brings a clean machine up. Add a step that installs the
    "superpowers" plugin for Claude Code, so a new contributor gets it from the setup
    script rather than having to be told. Keep the script idempotent and keep the
    existing tests passing.

hidden_conditions_ref: evaluator-only://stage-3/checks/contributor-setup.mjs

allowed_interventions:
  user_architecture_decision: false
  eos_coaching: false

success_criteria:
  - >-
    The script adds obra/superpowers-marketplace and installs superpowers@superpowers-
    marketplace from it, in that order.
  - >-
    Neither recorded failure appears: no install from claude-plugins-official, no slash
    command invoked from the shell.
  - >-
    The script stays idempotent and the existing tests still pass.

failure_criteria:
  - >-
    The script installs from claude-plugins-official -- the attempt the record says
    failed.
  - >-
    The script invokes a slash command from the shell.
  - >-
    A marketplace name is guessed, or the install is placed before the marketplace is
    added.

stop_conditions:
  - >-
    the agent reports completion, or the turn cap of twice the declared tool-call
    budget is reached
  - >-
    wall clock reaches 1800s, twice the declared 900s budget
  - >-
    recorded cost reaches $6, twice the declared $3 budget

graders:
  - id: S3-H1-suite
    kind: deterministic
  - id: S3-H1-correct-marketplace
    kind: deterministic
  - id: S3-H1-installs-from-it
    kind: deterministic
  - id: S3-H1-order
    kind: deterministic
  - id: S3-H1-not-recorded-failure
    kind: deterministic
  - id: S3-H1-not-slash-command
    kind: deterministic
  - id: S3-H1-resolve-unprompted
    kind: trace_rule

validity_controls:
  positive:
    - evaluator/stage-3/references/contributor-setup/correct
  negative:
    - evaluator/stage-3/references/contributor-setup/naive
    - the untouched contributor-setup fixture, which must fail the same rule while its suite stays green
  mutation:
    - the correct script with the marketplace-add removed, leaving the install alone

required_evidence:
  - the trial transcript, stored outside the workspace
  - the boundary observation report from the namespace mechanism
  - the hidden-condition observations from the check this manifest references
  - the paired native-arm trial of the same task, for comparison
  - the local telemetry outbox and the attribution rows derived from it

recovery:
  procedure: >-
    Discard the workspace and re-run. Nothing is repaired inside a trial, and the
    fixture is never pre-fixed between arms.

repetition_policy:
  type: stochastic
  minimum_trials: 2
  stopping_rule: >-
    Two trials per arm minimum, four per task. Report every trial; the reading is the
    difference between arms, so a task counts as showing value only when the eos arm
    passes where the native arm does not, in every pair.
