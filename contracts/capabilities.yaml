# STATUS: STRUCTURALLY VALID, DELIBERATELY UNSEEDED.
#
# D28 seeds this file from the legacy Engineering-OS repository's
# core/capability-registry.yaml. That repository is not reachable from the
# session that created this file, so no capability id has been written here.
#
# Inventing a taxonomy would create exactly the unprovenanced canonical knowledge
# the Architecture Constitution forbids: knowledge/ holds admitted material with
# provenance, and "we made it up because the source was unavailable" is not
# provenance. An honest empty file is the correct state.
#
# Tracked as open item O-5 in docs/plan/stage-0-plan.md and as remaining Stage 0
# acceptance criterion B4.

schema_version: '1'
