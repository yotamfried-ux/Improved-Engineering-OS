migration_path: null

seed:
  status: pending
  source:
    repository: yotamfried-ux/Engineering-OS
    path: core/capability-registry.yaml
    revision: null # recorded when the seed import actually runs
  note: >-
    Ids are kept verbatim from the source; enforcement fields are dropped (D28,
