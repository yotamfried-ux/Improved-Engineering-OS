# Stage 2 seed selection (guide Stage 2, C-04 bootstrap path).
#
# HAND-SELECTED, deliberately. The guide puts the bulk importer at Stage 5 and
# asks Stage 2 for "10-20 representative assets hand-selected from the legacy
# corpus". This file IS the hand selection: the tool below performs the
# mechanical part (reading bytes at an exact revision, extracting the named
# section, computing content_hash, emitting valid records) and chooses nothing.
#
# Ids are minted once and pinned here. D19 minted ids are opaque ULIDs and are
# deliberately NOT derived from content -- a rename must not change an id --
# so they cannot be recomputed. Pinning them is what makes a re-run idempotent.
#
# Capabilities: only ids that exist in contracts/capabilities.yaml appear here.
# The legacy registry turned out to be a WORKFLOW taxonomy (validation.*,
# routing.*, source.*), not a knowledge-domain one, so most of these assets have
# no capability that honestly covers them and declare none. Inventing
# `auth.oauth.pkce` and friends is exactly what O-5 refused to do, and D28 says
# the taxonomy grows only through its own promotion PR.

