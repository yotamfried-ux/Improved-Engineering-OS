packages:
  - 'packages/*'
  # The guide nests the adapters one level deeper (`packages/adapters/{mcp,cli,…}`),
  # so they need their own glob: `packages/*` does not reach them, and without
  # this they resolve no workspace dependency at all.
  - 'packages/adapters/*'
  - 'tools/*'
  - 'fitness'

# D18.6: refuse to install under a runtime that does not match engines.node.
engineStrict: true
