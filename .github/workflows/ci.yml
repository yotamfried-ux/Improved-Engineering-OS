name: ci

# Stage 0 CI (D18.3, R-12): Linux is primary, plus one Windows smoke job.
# The full four-platform matrix becomes a gate at Stage 4, not here.
#
# Every job below fails closed. Two failure modes get explicit guards, because
# both have already happened in this repository:
#   - an analyzer that parses nothing and reports success (dependency-cruiser
#     under an unsupported TypeScript version);
#   - a runner that discovers zero tests and exits 0.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A pinned toolchain is the point; CI must not silently drift off it.
env:
  NODE_VERSION: '24.20.0'
  PNPM_VERSION: '11.25.0'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (primary)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The Evidence Plane's guarantees -- D36's classification authority, D22's
    # credential boundary, RLS denying by default -- are enforced by the
    # database, so they are tested by executing the migration against a real
    # PostgreSQL rather than by reading the SQL. Without this service the suite
    # reports itself SKIPPED, which the qualification gate counts as unproven;
    # it never reports a pass it did not earn.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ieos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Local to the runner and thrown away with it. Not a credential in any
      # sense F9 is about, but it is still the only connection string in the
      # repository, so it is a throwaway password on a container that accepts
      # connections from this job alone.
      IEOS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ieos_test

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Toolchain matches the pins
        # Fails closed if the runner drifts off the pinned toolchain, before any
        # result produced on it could be mistaken for a result on the pinned one.
        run: |
          set -euo pipefail
          node --version
          pnpm --version
          pnpm ieos-doctor

      - name: Install with a frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Contract schemas are up to date
        run: pnpm contracts:check

      - name: Formatting
        run: pnpm format:check

      - name: Tests
        run: pnpm test

      - name: Guard against a vacuous test run
        # A runner that discovers nothing exits 0. This asserts a non-vacuous
        # corpus, so "all tests passed" cannot mean "no tests ran".
        run: node scripts/assert-corpus.mjs

      - name: The Evidence Plane suite really ran here
        # It skips itself when no database is reachable, which is the honest
        # answer on a developer's laptop and the wrong one in CI: this job
        # provides a database, so a skip here means the service or the client
        # is missing and the D22/D36 guarantees went unchecked while the job
        # stayed green. Fails closed on exactly that.
        run: |
          set -euo pipefail
          psql "$IEOS_TEST_DATABASE_URL" -tAc 'select 1' > /dev/null
          node node_modules/vitest/vitest.mjs run --project evidence-plane \
            --reporter=json --outputFile=/tmp/evidence-plane.json > /dev/null
          node -e '
            const r = require("/tmp/evidence-plane.json");
            const passed = r.numPassedTests ?? 0;
            const pending = (r.numTotalTests ?? 0) - passed - (r.numFailedTests ?? 0);
            if (pending > 0 || passed < 20) {
              console.error(`Evidence Plane suite did not run: ${passed} passed, ${pending} skipped`);
              process.exit(1);
            }
            console.log(`Evidence Plane: ${passed} tests executed against PostgreSQL`);
          '

      - name: Collect this platform's qualification evidence
        run: |
          set -euo pipefail
          pnpm report:collect qualification/evidence/platforms/linux.json \
            --stage 2 \
            --commit "${{ github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - uses: actions/upload-artifact@v4
        with:
          name: platform-linux
          path: qualification/evidence/platforms/linux.json
          if-no-files-found: error

      - name: Emit the bootstrap snapshot digest
        id: snapshot
        run: |
          set -euo pipefail
          DIGEST="$(pnpm --silent snapshot:emit -- --digest-only)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "linux snapshot digest: $DIGEST"

      - name: Publish the Linux digest for cross-platform comparison
        run: |
          set -euo pipefail
          mkdir -p digests
          printf '%s' '${{ steps.snapshot.outputs.digest }}' > digests/linux.txt

      - uses: actions/upload-artifact@v4
        with:
          name: linux-digest
          path: digests/linux.txt
          if-no-files-found: error

  windows-smoke:
    # D18.3: one Windows smoke job at Stage 0 -- path handling, CRLF, spawn --
    # and specifically the D35 cross-platform digest contract.
    name: windows smoke (D35 cross-platform digest)
    runs-on: windows-latest
    timeout-minutes: 20
    needs: linux
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Toolchain matches the pins
        shell: bash
        run: |
          set -euo pipefail
          node --version
          pnpm --version
          pnpm ieos-doctor

      - name: Install with a frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # The smallest set that genuinely exercises the cross-platform contract:
      # canonical hashing, deterministic identities, the file-manifest ordering
      # rules, and the bootstrap snapshot. Path separators, CRLF checkout and
      # UTF-16-vs-UTF-8 ordering all bite here if they are going to bite.
      - name: Core determinism suite
        run: pnpm vitest run --project core

      - name: Bootstrap snapshot suite
        run: pnpm vitest run --project snapshot-emit

      - name: SQLite qualification (check 3 on win32)
        # The half of the seven recorded checks that names Windows explicitly.
        run: pnpm vitest run --project sqlite-qualification

      - name: Knowledge index build and read on win32
        # Both packages drive node:sqlite and FTS5 through real files, and the
        # index build must be byte-for-byte deterministic across platforms (F8).
        # This is precisely the class of defect the Windows job exists to catch.
        run: pnpm vitest run --project releases --project store-sqlite

      - name: The ieos CLI on win32
        # `ieos doctor` is a Stage 1 gate row, and the doctor's session-kind and
        # path handling are exactly what differs between platforms.
        run: pnpm vitest run --project cli

      - name: Deterministic ranking on win32
        # D20.3's ordering must be identical on both platforms: it feeds
        # `context_snapshot_id`, so a locale- or order-dependent sort would make
        # a decision unreproducible across machines.
        run: pnpm vitest run --project resolver

      - name: Telemetry, derivation and the agent hooks on win32
        # All three drive real files, real SQLite and real subprocesses, which
        # is exactly where the two platforms differ. The hook adapter especially:
        # its exit-code rule has to hold identically wherever the agent runs.
        run: pnpm vitest run --project telemetry --project evidence-derivation --project claude-code

      - name: The seed importer and the trial harness on win32
        # Both were linux-only, and the Stage 2 gate said so: H1 and H9 came
        # back `unproven` because two of their named tests had never been
        # observed here. Declaring those tests platform-independent would have
        # been the cheap way out; running them is the honest one. The harness
        # especially -- its containment probes resolve real paths and follow
        # real symlinks, which is exactly the kind of thing that differs.
        run: pnpm vitest run --project seed-import --project harness

      - name: The Evidence Plane suite on win32
        # No PostgreSQL service here, so this SKIPS -- and recording the skip is
        # the point. The win32 record then says "unproven on this platform"
        # rather than omitting the tests, and the Stage 2 gate reads H5 from the
        # platform that did run them.
        run: pnpm vitest run --project evidence-plane

      - name: MCP 2026-07-28 conformance smoke on win32
        # The protocol layer has no filesystem in it, but the runtime that
        # serves it does run here, and Stage 0 already caught two defects on
        # win32 that Linux structurally cannot show.
        run: pnpm vitest run --project mcp

      - name: Guard against a vacuous test run
        shell: bash
        run: node scripts/assert-corpus.mjs --windows-smoke

      # The suite above proves the checks pass here; this records *what was
      # measured*, per check, so win32 coverage is evidence in the repository
      # rather than a green tick in a log that expires. `better-sqlite3` is
      # deliberately not a dependency, so it is not resolvable here and reports
      # itself as not executed rather than being silently omitted.
      - name: Record the SQLite qualification evidence for win32
        # --out is mandatory here. The default path holds the committed
        # two-candidate record, and this runner cannot resolve better-sqlite3,
        # so writing there would replace it with a one-candidate record -- and
        # the suite that reads that file would then fail on evidence this step
        # had destroyed underneath it. That is not hypothetical; it is what the
        # first version of this step did.
        run: pnpm sqlite:qualify --out qualification/evidence/sqlite-qualification.win32.json

      - uses: actions/upload-artifact@v4
        with:
          name: windows-sqlite-qualification
          path: qualification/evidence/sqlite-qualification.win32.json
          if-no-files-found: error

      - name: Collect this platform's qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          pnpm report:collect qualification/evidence/platforms/win32.json \
            --stage 2 \
            --projects core,snapshot-emit,sqlite-qualification,releases,store-sqlite,mcp,cli,resolver,telemetry,evidence-derivation,claude-code,evidence-plane,seed-import,harness \
            --commit "${{ github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo '--- win32 platform record (verbatim) ---'
          cat qualification/evidence/platforms/win32.json

      - uses: actions/upload-artifact@v4
        with:
          name: platform-win32
          path: qualification/evidence/platforms/win32.json
          if-no-files-found: error

      - uses: actions/download-artifact@v4
        with:
          name: linux-digest
          path: digests

      - name: Compare the D35 digest with Linux
        shell: bash
        run: |
          set -euo pipefail
          WINDOWS="$(pnpm --silent snapshot:emit -- --digest-only)"
          LINUX="$(cat digests/linux.txt)"
          echo "linux:   $LINUX"
          echo "windows: $WINDOWS"
          if [ "$WINDOWS" != "$LINUX" ]; then
            echo "::error::D35 cross-platform gate FAILED: the bootstrap snapshot digest differs between Linux and Windows."
            exit 1
          fi
          echo "D35 cross-platform digest gate: identical on both platforms."

  stage-0-report:
    # The harness-generated qualification report (guide section 4): the only
    # artifact permitted to claim a gate passed. It runs here, after both
    # platforms have reported, because a report about two platforms cannot
    # honestly be produced by one. It fails the build when the verdict is not
    # PASS, so "CI green" and "the stage closed" cannot drift apart.
    name: qualification reports
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [linux, windows-smoke]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install with a frozen lockfile
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          pattern: platform-*
          path: platforms
          merge-multiple: true

      - name: Both platform records are present
        # Without this, a missing artifact would silently reduce the report to a
        # one-platform judgement, which it would correctly mark UNPROVEN -- but
        # the cause would look like a contract problem rather than a plumbing one.
        run: |
          set -euo pipefail
          ls -l platforms
          test -f platforms/linux.json
          test -f platforms/win32.json

      - name: Generate the Stage 0 qualification report
        run: |
          set -euo pipefail
          pnpm --silent report:stage0 \
            --evidence-dir platforms \
            --out qualification/reports/stage-00-report.md

      - name: Generate the Stage 1 qualification report
        # Runs even when Stage 0's step failed, because a Stage 1 report that
        # says NOT PASSED is the artifact this repository wants either way. The
        # job still fails: the exit code carries the verdict.
        if: always()
        run: |
          set -euo pipefail
          pnpm --silent report:stage1 \
            --evidence-dir platforms \
            --out qualification/reports/stage-01-report.md

      - name: Generate the Stage 2 qualification report
        # Same reason as Stage 1's `always()`: a NOT PASSED report is the
        # artifact either way, and the exit code still carries the verdict.
        if: always()
        run: |
          set -euo pipefail
          pnpm --silent report:stage2 \
            --evidence-dir platforms \
            --out qualification/reports/stage-02-report.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-reports
          path: |
            qualification/reports/stage-00-report.md
            qualification/reports/stage-01-report.md
            qualification/reports/stage-02-report.md
          if-no-files-found: error
