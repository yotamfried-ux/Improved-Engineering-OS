name: stage3-format-probe

on:
  push:
    branches:
      - tmp/stage3-format-probe-20260915

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          pnpm exec prettier --write \
            tools/harness/src/stage3-host-preflight.ts \
            tools/harness/src/stage3-preflight-cli.ts \
            tools/harness/test/stage3-host-preflight.test.ts
          git diff --no-color -- \
            tools/harness/src/stage3-host-preflight.ts \
            tools/harness/src/stage3-preflight-cli.ts \
            tools/harness/test/stage3-host-preflight.test.ts
