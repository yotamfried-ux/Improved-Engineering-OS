name: temporary codex formatting

on:
  push:
    branches:
      - feat/stage3-codex-driver
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '24.20.0'
  PNPM_VERSION: '11.25.0'

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format Codex Stage 3 files
        run: |
          pnpm prettier --write \
            tools/harness/src/drivers/codex.ts \
            tools/harness/src/stage3-campaign.ts \
            tools/harness/src/stage3-campaign-report-cli.ts \
            tools/harness/src/stage3-cli.ts \
            tools/harness/test/no-rescue-channel.test.ts

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/harness/src/drivers/codex.ts \
            tools/harness/src/stage3-campaign.ts \
            tools/harness/src/stage3-campaign-report-cli.ts \
            tools/harness/src/stage3-cli.ts \
            tools/harness/test/no-rescue-channel.test.ts
          git commit -m "style(stage3): format Codex driver"
          git push origin HEAD:feat/stage3-codex-driver
